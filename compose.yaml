services:
  node:
    image: ghcr.io/zerocluster/node

    build:
      context: .
      args:
        UBUNTU_VERSION: 26.04
        NODE_VERSION: lts-latest
        NPM_VERSION: latest
      secrets:
        - id=GITHUB_TOKEN,env=GITHUB_TOKEN

  app:
    depends_on: [node]
    image: ghcr.io/zerocluster/node/app

    build:
      context: .
      dockerfile: app.dockerfile
      secrets:
        - id=GITHUB_TOKEN,env=GITHUB_TOKEN
